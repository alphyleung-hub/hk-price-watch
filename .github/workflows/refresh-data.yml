# Refreshes prices daily (6am HKT) and commits them, which triggers a Cloudflare Pages rebuild.
name: refresh-data
on:
  schedule: [{ cron: '0 22 * * *' }]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-data.mjs
      - run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data
          git diff --staged --quiet || (git commit -m "Update price data" && git push)
